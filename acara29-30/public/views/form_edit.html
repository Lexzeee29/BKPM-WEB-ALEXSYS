<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Mahasiswa | SI Akademik</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="dashboard.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <section class="student-dashboard" aria-labelledby="edit-title">
      <header class="dashboard-heading">
        <div>
          <p class="dashboard-eyebrow">SMART VILLAGE / AKADEMIK</p>
          <h1 id="edit-title">Ubah data mahasiswa</h1>
          <p class="dashboard-subtitle">Perbarui informasi mahasiswa.</p>
        </div>
        <a class="btn btn-outline-secondary" href="../dashboard">Kembali ke dashboard</a>
      </header>

      <form id="edit-student-form" novalidate>
        <p id="edit-message" class="form-message" role="status" aria-live="polite">Memuat data mahasiswa...</p>
        <div class="student-form-grid">
          <label>
            <span>NIM</span>
            <input class="form-control" name="nim" type="text" inputmode="numeric" pattern="[0-9]{9}" maxlength="9" required>
          </label>
          <label>
            <span>Nama</span>
            <input class="form-control" name="nama" type="text" maxlength="100" required>
          </label>
          <label>
            <span>Email</span>
            <input class="form-control" name="email" type="email" maxlength="100" required>
          </label>
          <label>
            <span>Program studi</span>
            <select class="form-select" name="prodi_id" required>
              <option value="1">Teknik Informatika</option>
              <option value="2">Sistem Informasi</option>
              <option value="3">Teknik Komputer</option>
            </select>
          </label>
          <label>
            <span>Angkatan</span>
            <input class="form-control" name="angkatan" type="number" min="2000" max="2155" required>
          </label>
          <label>
            <span>Foto baru (opsional, JPG/PNG maksimal 2MB)</span>
            <input class="form-control" name="foto" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
          </label>
        </div>
        <img id="student-photo-preview" class="student-photo-preview" alt="Pratinjau foto mahasiswa" hidden>
        <div class="student-dialog-actions">
          <a class="btn btn-outline-secondary" href="../dashboard">Batal</a>
          <button class="btn btn-primary" id="save-student" type="submit" disabled>Simpan perubahan</button>
        </div>
      </form>
    </section>
  </main>
  <script src="view-support.js" defer></script>
  <script src="form_edit.js" defer></script>
</body>
</html>
